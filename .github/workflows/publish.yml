# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `n8n-node release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# OIDC Trusted Publishing (no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: AFGES
#        Repository name:  n8n-nodes-amalia
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#
# No NPM_TOKEN secret is used or needed: GitHub's OIDC token authenticates the
# publish and signs the provenance statement.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# The source of truth is https://git.afges.eu/n8n/<repo>; GitHub is its push
# mirror. Run the following command locally to start an interactive release:
#
#   npm run release
#
# release-it (.release-it.json) lints, builds, prompts for a version bump,
# updates the changelog, commits, tags and pushes to Forgejo. The push mirror
# copies the tag here, which triggers this workflow: publish to npm, then
# create the GitHub release.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

# Never cancel a release in progress; queue newer tags instead.
concurrency:
  group: publish
  cancel-in-progress: false

# No token permissions by default; the job opts in to what it needs.
permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write # mint OIDC token for npm provenance
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          # No dependency cache: release artifacts must not depend on a poisonable cache.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation, authenticated through
        # OIDC trusted publishing (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        # n8n-node release, not `npm run release` (local release-it, no publish).
        run: npx n8n-node release

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write # create the release

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Create release
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
